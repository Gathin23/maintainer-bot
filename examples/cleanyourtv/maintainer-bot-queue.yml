# .github/workflows/maintainer-bot-queue.yml for Gathin23/cleanyourtv (phase 2).
#
# 09:17 IST every day: one issue "Today's queue YYYY-MM-DD" built from the phase-1 reviews (no model calls).
# The owner comments /approve (or /approve except #a, /skip #n, /close #n reason, /rework #n ask) on that issue,
# and the bot does the work: merges (small fixes go through a bot/merge-<n> PR and CI first), thank-you
# comments, rework asks, kind closes, then one "README counts after today's merges" PR (the TV tables, brand
# line and counts, regenerated from examples/*/tv.json).
#
# Safety: nothing here runs on pull requests, so no PR code ever runs with these secrets. Commands are read
# only from the repo owner (and MAINTAINER_BOT_ALLOW_USERS), only on issues labelled maintainer-queue.
# The bot never pushes to main: it pushes bot/* branches and merges through PRs that need green CI.
# A wave (one /approve) only acts on lists, docs, themes, SHOWCASE.md, README table rows (moved into the list's
# tv.json on merge) and launcher translations; launcher code, addons/, tools/, PROMPT.md, scripts and workflows stay for the owner. It starts only
# when main's CI is green, waits for main's CI again every few merges, and acts on at most
# MAINTAINER_BOT_MAX_WAVE PRs (default 25).
# The README tables and counts run the repo's own tools (tools/gen_tables.py, which calls readme_stats.py and
# readme_card.py), so they get a job of their own with no secrets and no token at all; a third job, which runs no repo code, checks the patch they made
# (counts files only) and opens the counts PR with an App token cut down to contents and pull requests.
# Identity: a GitHub App (MAINTAINER_BOT_CLIENT_ID + MAINTAINER_BOT_PRIVATE_KEY) or, as a fallback, a
# fine-grained token (MAINTAINER_BOT_TOKEN); the workflow's own GITHUB_TOKEN can't trigger CI on bot branches.
# Spend: the fix model shares the review workflow's daily ledger and cap (MAINTAINER_BOT_DAILY_CAP, default $25).
name: maintainer-bot queue
on:
  schedule:
    - cron: "47 3 * * *"  # 03:47 UTC = 09:17 IST
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: merge-queue, cancel-in-progress: false }
    env:
      HAS_APP: ${{ secrets.MAINTAINER_BOT_CLIENT_ID != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MAINTAINER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MAINTAINER_BOT_PRIVATE_KEY }}
      - uses: Gathin23/maintainer-bot@PINNED_SHA # maintainer-bot master, pinned
        with:
          mode: queue
          github-token: ${{ steps.app.outputs.token || secrets.MAINTAINER_BOT_TOKEN }}
          allowed-users: ${{ vars.MAINTAINER_BOT_ALLOW_USERS }}

  act:
    if: >-
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'maintainer-queue') &&
      contains(github.event.comment.body, '/') &&
      (github.event.comment.author_association == 'OWNER' ||
       contains(format(',{0},', vars.MAINTAINER_BOT_ALLOW_USERS), format(',{0},', github.event.comment.user.login)))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency: { group: merge-queue, cancel-in-progress: false }
    outputs:
      merged: ${{ steps.bot.outputs.merged }}
    env:
      HAS_APP: ${{ secrets.MAINTAINER_BOT_CLIENT_ID != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MAINTAINER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MAINTAINER_BOT_PRIVATE_KEY }}
      - id: who
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$SLUG" ]; then
            id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
            echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
            echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || secrets.MAINTAINER_BOT_TOKEN }}
          fetch-depth: 0
          path: repo
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .maintainer-bot
          # the review workflow's daily ledger: fix calls count toward the same daily cap
          key: maintainer-bot-ledger-${{ steps.day.outputs.day }}-${{ github.run_id }}
          restore-keys: maintainer-bot-ledger-${{ steps.day.outputs.day }}-
      - id: bot
        uses: Gathin23/maintainer-bot@PINNED_SHA # maintainer-bot master, pinned
        env:
          MB_GIT_NAME: ${{ steps.who.outputs.name }}
          MB_GIT_EMAIL: ${{ steps.who.outputs.email }}
        with:
          mode: command
          github-token: ${{ steps.app.outputs.token || secrets.MAINTAINER_BOT_TOKEN }}
          og-pc-api-key: ${{ secrets.OG_PC_API_KEY }}
          allowed-users: ${{ vars.MAINTAINER_BOT_ALLOW_USERS }}
          workdir: repo
          daily-cap-usd: ${{ vars.MAINTAINER_BOT_DAILY_CAP || '25' }}
          max-wave: ${{ vars.MAINTAINER_BOT_MAX_WAVE || '25' }}
          main-check-every: ${{ vars.MAINTAINER_BOT_MAIN_CHECK_EVERY || '5' }}
          counts-note: "README counts: a separate job redraws them and opens \"README counts after today's merges\"."

  counts:
    # Runs the repo's tools/gen_tables.py (tables, brand line, counts, card) with no secrets and no token:
    # checkout without credentials, contents read only.
    needs: act
    if: needs.act.outputs.merged != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.counts.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gathin23/maintainer-bot
          ref: PINNED_SHA
          path: bot
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Fredoka for the README card (same file the card was drawn with)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/Fredoka.ttf" "https://github.com/google/fonts/raw/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf"
          echo "2ba02e68b152868aef9ba28e24b3648c7d457fe6f25c761f2c2c53fb61a73fc8  $RUNNER_TEMP/Fredoka.ttf" | sha256sum -c -
      - id: counts
        run: |
          python -m pip install -q "pillow==12.2.0"
          mkdir -p counts
          python3 bot/examples/cleanyourtv/update_counts.py repo --font "$RUNNER_TEMP/Fredoka.ttf" | tail -n 1 > counts/counts.json
          git -C repo diff --binary > counts/counts.patch
          cat counts/counts.json
          if [ -s counts/counts.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: counts
          path: counts/
          retention-days: 3

  counts-pr:
    # Runs no repo code: checks the patch (counts files only), applies it to main, opens the PR, waits for CI, merges.
    needs: [act, counts]
    if: needs.counts.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: merge-queue-counts, cancel-in-progress: false }
    env:
      HAS_APP: ${{ secrets.MAINTAINER_BOT_CLIENT_ID != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MAINTAINER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MAINTAINER_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - id: who
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$SLUG" ]; then
            id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
            echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
            echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || secrets.MAINTAINER_BOT_TOKEN }}
          ref: main
          path: repo
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: counts
          path: counts
      - uses: Gathin23/maintainer-bot@PINNED_SHA # maintainer-bot master, pinned
        env:
          MB_GIT_NAME: ${{ steps.who.outputs.name }}
          MB_GIT_EMAIL: ${{ steps.who.outputs.email }}
        with:
          mode: counts-pr
          github-token: ${{ steps.app.outputs.token || secrets.MAINTAINER_BOT_TOKEN }}
          workdir: repo
          counts-dir: counts
          merged: ${{ needs.act.outputs.merged }}
