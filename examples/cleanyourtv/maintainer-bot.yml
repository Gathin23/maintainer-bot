# .github/workflows/maintainer-bot.yml for Gathin23/cleanyourtv: review every PR as it arrives (phase 1: suggest only).
#
# Safety: pull_request_target runs with secrets, so this workflow NEVER checks out or runs the PR's code.
# The bot reads the PR through the API (title, body, file list, patches) and reads its rules
# (.github/maintainer/MAINTAINER.md) and precedents from the default branch, never from the PR.
# It only writes one sticky comment and labels from a fixed list. It never merges, closes or approves.
name: maintainer-bot
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review (empty = every open PR, oldest first, until the daily cap)
        required: false
        default: ""
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: maintainer-bot-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'backfill' }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/bot review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .maintainer-bot
          key: maintainer-bot-ledger-${{ steps.day.outputs.day }}-${{ github.run_id }}
          restore-keys: maintainer-bot-ledger-${{ steps.day.outputs.day }}-
      - uses: Gathin23/maintainer-bot@PINNED_SHA # replace with the commit SHA of the release you trust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          og-pc-api-key: ${{ secrets.OG_PC_API_KEY }}
          pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          force: ${{ github.event_name == 'issue_comment' }}
          daily-cap-usd: "5"
