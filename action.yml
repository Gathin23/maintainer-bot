name: maintainer-bot
description: Reviews pull requests the way your maintainer does; on a maintainer's /approve it does the merges. Runs on 0G Private Computer.
branding: { icon: check-circle, color: green }
inputs:
  mode:
    description: "review (phase 1, default) | queue (open today's queue issue) | command (act on a /approve comment)"
    required: false
    default: review
  github-token:
    description: "review: pull-requests and issues write (GITHUB_TOKEN is enough). queue/command: a GitHub App or
      fine-grained token with contents, pull requests and issues write, so the bot's branches trigger CI"
    required: true
  og-pc-api-key:
    description: 0G Private Computer API key (store it as a repository secret); not needed for mode queue
    required: false
    default: ""
  allowed-users:
    description: "queue/command: logins besides the repo owner whose commands are read (comma or space separated)"
    required: false
    default: ""
  counts-command:
    description: "command: run in a fresh checkout of main after the batch to update README counts (prints JSON)"
    required: false
    default: ""
  workdir:
    description: "command: a checkout of the repo (with push access through the token) for the bot/* branches"
    required: false
    default: ""
  pr:
    description: pull request number to review; empty reviews every open PR (backfill)
    required: false
    default: ""
  force:
    description: "true: review again even if this commit was already reviewed"
    required: false
    default: "false"
  dry-run:
    description: "true: print the comment and labels, write nothing"
    required: false
    default: "false"
  daily-cap-usd:
    description: stop reviewing for the day once this much was spent
    required: false
    default: "5"
  per-pr-cap-usd:
    description: most a single review may spend
    required: false
    default: "0.5"
  model:
    description: 0G router model for the decision and the critic
    required: false
    default: claude-opus-5.5
  second-model:
    description: 0G router model for the cheap second opinion
    required: false
    default: glm-5.3-flash
  ledger-dir:
    description: where the spend ledger lives (cache it between runs to enforce the daily cap)
    required: false
    default: .maintainer-bot
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with: { python-version: "3.12" }
    - shell: bash
      env:
        MB_MODE: ${{ inputs.mode }}
      run: |
        python -m pip install -q "requests==2.32.3"
        if [ "$MB_MODE" = "command" ]; then python -m pip install -q "pillow==12.2.0"; fi
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OG_PC_API_KEY: ${{ inputs.og-pc-api-key }}
        PYTHONPATH: ${{ github.action_path }}
        MB_LEDGER: ${{ github.workspace }}/${{ inputs.ledger-dir }}/ledger.jsonl
        MB_DAILY_CAP: ${{ inputs.daily-cap-usd }}
        MB_PER_PR_CAP: ${{ inputs.per-pr-cap-usd }}
        MB_MODEL: ${{ inputs.model }}
        MB_SECOND_MODEL: ${{ inputs.second-model }}
        MB_PR: ${{ inputs.pr }}
        MB_FORCE: ${{ inputs.force }}
        MB_DRY_RUN: ${{ inputs.dry-run }}
        MB_REPO: ${{ github.repository }}
        MB_MODE: ${{ inputs.mode }}
        MB_WRITE_TOKEN: ${{ inputs.github-token }}
        MB_ALLOW_USERS: ${{ inputs.allowed-users }}
        MB_COUNTS_CMD: ${{ inputs.counts-command }}
        MB_WORKDIR: ${{ inputs.workdir }}
        MB_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ "$MB_MODE" = "queue" ]; then
          python -m maintainer_bot queue-issue --repo "$MB_REPO"
          exit 0
        fi
        if [ "$MB_MODE" = "command" ]; then
          python -m maintainer_bot on-comment --repo "$MB_REPO" --event "$GITHUB_EVENT_PATH" --workdir "$MB_WORKDIR"
          exit 0
        fi
        args=()
        [ "$MB_FORCE" = "true" ] && args+=(--force)
        [ "$MB_DRY_RUN" = "true" ] && args+=(--dry-run)
        if [ -n "$MB_PR" ]; then
          python -m maintainer_bot review --repo "$MB_REPO" --pr "$MB_PR" "${args[@]}"
        else
          python -m maintainer_bot backfill --repo "$MB_REPO" "${args[@]}"
        fi
